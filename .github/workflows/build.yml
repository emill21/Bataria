name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk BatteryPulse.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Battery Pulse build ${{ github.run_number }}
          body: Install BatteryPulse.apk on your phone (allow installing unknown apps when asked).
          files: BatteryPulse.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryPulse-apk
          path: BatteryPulse.apk

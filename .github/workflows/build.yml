name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Release notes
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          jq -r '.[0] | "## \(.title)\n\n" + (.items | map("- " + .) | join("\n"))' app/src/main/assets/changelog.json > notes.md
          printf '\n\n**Install:** download **Bataria.apk** below and open it on your phone. From 3.4 on, updates install over the previous version and keep your data.\n' >> notes.md
          cat notes.md
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk Bataria.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bataria ${{ env.VERSION }} (build ${{ github.run_number }})
          body_path: notes.md
          files: Bataria.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: Bataria-apk
          path: Bataria.apk
